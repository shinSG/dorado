services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8500:8500"
    volumes:
      - ./backend:/app
      - ./content:/app/../content
    environment:
      - DORADO_HOST=0.0.0.0
      - DORADO_PORT=8500
    depends_on:
      - sandbox

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  sandbox:
    build:
      context: ./docker/sandbox
    image: dorado-sandbox:latest
    # This image is used by the backend to run code
    # It's not a running service, just needs to be built
    entrypoint: ["echo", "Sandbox image ready"]
